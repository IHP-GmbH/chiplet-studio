# SPDX-License-Identifier: Apache-2.0
#
# IHP 130-nm IntM4TM2 aluminum BEOL interposer stackup
#
# Based on SG13G2 process spec Rev 1.2 (BEOL thicknesses) and
# SG13G2 Layout Rules Rev 2.1.
#
# 3D interconnect bodies (cu-pillar/solder-bump, layers 500+) are owned by the
# interconnect PDK and merged in at render time per the assembly's
# interconnect.adapter. See interconnect_pdk/libs.tech/chiplet_studio/stackup_fragments/.

# The surface this interposer offers to interconnect bodies: the exposed pad
# top (TopMetal2 top, through the passivation opening). Fragments declaring
# z_reference: attachment_surface are offset by this value at merge time.
# NOT max_z: the passivation around the opening (Passiv top, 15.73) rises
# above the real mounting surface.
attachment_surface_z: 13.83

# --- Si bulk substrate (visualized at 50 um -- aesthetic, NOT physical) ---
# True wafer is 750 um per SG13G2 spec. We render a much thinner slab so
# RDL routing, cu-pillars, and chiplets sitting on top remain visible at
# usable camera distances. For physically-accurate rendering (thermal/
# mechanical sims), restore height: 750.0 here.
Substrate:
  index: 40
  type: 0
  z: -50.0
  height: 50.0

# --- Interposer RDL routing layers (Metal4 through TopMetal2) ---

Metal4:
  index: 50
  type: 0
  z: 3.66
  height: 0.49
Via4:
  index: 66
  type: 0
  z: 4.15
  height: 0.54
Metal5:
  index: 67
  type: 0
  z: 4.69
  height: 0.49
TopVia1:
  index: 125
  type: 0
  z: 5.18
  height: 0.85
TopMetal1:
  index: 126
  type: 0
  z: 6.03
  height: 2.00
TopVia2:
  index: 133
  type: 0
  z: 8.03
  height: 2.80
TopMetal2:
  index: 134
  type: 0
  z: 10.83
  height: 3.00

# --- Passivation (1500nm oxide + 400nm SiN = 1.9um total) ---
# Note: Passiv:pillar (9/35) openings are holes in this layer.
# The 3D viewer extrudes this as a solid; the openings in the
# passivation are not rendered as cutouts (limitation of 2.5D extrusion).

Passiv:
  index: 9
  type: 0
  z: 13.83
  height: 1.90

# --- Cu-Pillar fabrication layers (datatype 35 = pillar variant) ---
# These are the same physical layers as their parent (Passiv, dfpad, Recog)
# but with datatype 35 to indicate cu-pillar pad regions.
# Rendered at TopMetal2 z so they visually merge with the interposer pad.

Passiv_pillar:
  index: 9
  type: 35
  z: 10.83
  height: 3.00

dfpad_pillar:
  index: 41
  type: 35
  z: 10.83
  height: 3.00

Recog_pillar:
  index: 99
  type: 35
  z: 10.83
  height: 3.00
